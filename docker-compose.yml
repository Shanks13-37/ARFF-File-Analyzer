services:
  postgres:
    image: postgres:16-alpine
    container_name: arff-file-analyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arff_analyzer
      POSTGRES_USER: arff_user
      POSTGRES_PASSWORD: arff_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arff_user -d arff_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
